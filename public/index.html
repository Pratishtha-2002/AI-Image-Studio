<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator Using HTML, CSS, JavaScript</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRA6z0g1K403kJGJdBZDEfGkzVsNPdUQZ1Koe_sBD7SBw&s=10" type="image/x-icon">
</head>
<body>
    <div class="generator-container">
        <h1 class="title">AI IMAGE STUDIO</h1>

        <div class="image-box" id="image-box">
            <p class="placeholder-text" id="placeholder">Your AI masterpiece will appear here...</p>
        </div>

        <div class="input-group">
            <input class="prompt-input" type="text" id="prompt-input" placeholder="Enter Image name here...">
            <button class="generate-btn" id="generate-btn">Generate</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
